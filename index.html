<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>Jackson Smart Technologies (PTY) LTD</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
/* ================= YOUR ORIGINAL CSS (UNCHANGED FOR SPACE) ================= */

body{
    margin:0;
    font-family:'Poppins',sans-serif;
    background:#0f172a;
    color:white;
}

/* Keep your full CSS here (unchanged) */

/* Simple admin table styling */
table{
    width:100%;
    border-collapse:collapse;
    margin-top:20px;
    background:#1e293b;
}

th,td{
    padding:12px;
    border:1px solid #334155;
    font-size:13px;
}

th{
    background:#111827;
    color:#00d2ff;
}
</style>
</head>

<body>

<!-- HERO / SITE CONTENT (KEEP YOUR ORIGINAL SECTIONS) -->
<h1 style="text-align:center;padding:30px;">Jackson Smart Technologies</h1>

<!-- ================= BOOKING FORM ================= -->
<section style="padding:40px;">

<h2>Book Consultation</h2>

<form id="bookingForm">

<input id="name" type="text" placeholder="Full Name" required><br><br>

<input id="email" type="email" placeholder="Email Address" required><br><br>

<input id="phone" type="tel" placeholder="Phone Number" required><br><br>

<select id="service" required>
<option value="">Select Service</option>
<option>Smart Security Systems</option>
<option>Software Development</option>
<option>AI & Automation</option>
<option>Access Control</option>
</select><br><br>

<textarea id="message" placeholder="Project Details"></textarea><br><br>

<button type="submit">Submit Booking</button>

</form>

</section>

<!-- ================= ADMIN VIEW (LIVE BOOKINGS) ================= -->
<section style="padding:40px;">

<h2>Admin Panel - Bookings</h2>

<table>
<thead>
<tr>
<th>Name</th>
<th>Email</th>
<th>Phone</th>
<th>Service</th>
<th>Message</th>
<th>Time</th>
</tr>
</thead>

<tbody id="bookingTable"></tbody>

</table>

</section>

<!-- ================= FIREBASE + LOGIC ================= -->
<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { 
    getFirestore, 
    collection, 
    addDoc, 
    onSnapshot, 
    serverTimestamp 
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

/* ================= FIREBASE CONFIG ================= */
const firebaseConfig = {
    apiKey: "AIzaSyBD_sX8kF3m2t_s_b8ihzLx8XHs-M1MGGI",
    authDomain: "jackson-smart-technologi-1db26.firebaseapp.com",
    projectId: "jackson-smart-technologi-1db26",
    storageBucket: "jackson-smart-technologi-1db26.firebasestorage.app",
    messagingSenderId: "400637493049",
    appId: "1:400637493049:web:8d349168400988493672e8"
};

/* INIT FIREBASE */
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

/* ================= SAVE BOOKING ================= */
const form = document.getElementById("bookingForm");

form.addEventListener("submit", async (e) => {
    e.preventDefault();

    try {
        await addDoc(collection(db, "bookings"), {
            name: document.getElementById("name").value,
            email: document.getElementById("email").value,
            phone: document.getElementById("phone").value,
            service: document.getElementById("service").value,
            message: document.getElementById("message").value,
            time: new Date()
        });

        alert("✅ Booking submitted successfully!");
        form.reset();

    } catch (error) {
        console.error(error);
        alert("❌ Error submitting booking");
    }
});

/* ================= LOAD BOOKINGS (ADMIN LIVE TABLE) ================= */
const table = document.getElementById("bookingTable");

onSnapshot(collection(db, "bookings"), (snapshot) => {

    table.innerHTML = "";

    snapshot.forEach((doc) => {
        const d = doc.data();

        table.innerHTML += `
        <tr>
            <td>${d.name || ""}</td>
            <td>${d.email || ""}</td>
            <td>${d.phone || ""}</td>
            <td>${d.service || ""}</td>
            <td>${d.message || ""}</td>
            <td>${d.time ? new Date(d.time.seconds * 1000).toLocaleString() : ""}</td>
        </tr>
        `;
    });

});

</script>

</body>
</html>
